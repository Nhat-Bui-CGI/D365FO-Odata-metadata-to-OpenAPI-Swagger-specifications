[package]
name = "d365-openapi-app"
version = "0.1.0"
edition = "2024"

[dependencies]
d365-fetch = { version = "0.1.0", path = "../d365-fetch" }
d365-openapi-core = { version = "0.1.0", path = "../d365-openapi-core" }
eframe = { version = "0.37.0", features = ["glow"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webbrowser = "1.2.5"
