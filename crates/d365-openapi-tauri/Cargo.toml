[package]
name = "d365-openapi-tauri"
version = "1.0.0"
edition = "2024"

[dependencies]
d365-fetch = { version = "1.0.0", path = "../d365-fetch" }
d365-openapi-core = { version = "1.0.0", path = "../d365-openapi-core" }
d365-openapi-desktop = { version = "1.0.0", path = "../d365-openapi-desktop" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"

[build-dependencies]
tauri-build = "2"
